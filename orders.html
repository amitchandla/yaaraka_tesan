<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Golden Pizza Cafe</title>
<link rel="icon" href="assets/logo/golden-pizza-logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo/golden-pizza-logo.png" alt="Golden Pizza Cafe logo">
      <span class="brand-name">Golden Pizza Cafe<span>Behal · Bhiwani</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="nav-icon-btn" title="Account" data-account-label>Login</a>
      <button class="nav-icon-btn" data-cart-open title="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </button>
    </div>
    <button class="hamburger" data-hamburger aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </div>
</header>

<section class="hero" style="padding-bottom:20px;">
  <div class="container" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;">
    <div>
      <div class="hero-badge"><span class="dot"></span> Your Account</div>
      <h1 style="font-size:clamp(30px,4.5vw,48px);">My Orders</h1>
    </div>
    <button data-logout class="btn btn-outline btn-sm">Log Out</button>
  </div>
</section>

<section style="padding-top:0;">
  <div class="container" style="max-width:760px;">
    <div data-orders-list style="display:flex;flex-direction:column;gap:16px;"></div>
  </div>
</section>

<footer style="margin-top:40px;">
  <div class="container">
    <div class="footer-bottom">
      <span>© <span data-year></span> Golden Pizza Cafe. All rights reserved.</span>
      <span>Owned by Nissu · Behal, Bhiwani</span>
    </div>
  </div>
</footer>

<div class="overlay" data-overlay></div>
<aside class="cart-drawer" data-cart-drawer>
  <div class="cart-head">
    <strong style="font-family:var(--font-display);text-transform:uppercase;">Your Cart</strong>
    <button class="nav-icon-btn" data-cart-close aria-label="Close cart">✕</button>
  </div>
  <div class="cart-items" data-cart-items></div>
  <div class="cart-summary">
    <div class="summary-row total"><span>Estimated Total</span><b data-cart-subtotal>₹0</b></div>
    <a href="checkout.html" class="btn btn-primary btn-block" data-cart-checkout style="margin-top:14px;">Proceed to Checkout</a>
  </div>
</aside>

<nav class="mobile-tabbar">
  <a href="index.html">🏠<span>Home</span></a>
  <a href="menu.html">📋<span>Menu</span></a>
  <a href="#" data-cart-open>🛒<span>Cart</span></a>
  <a href="orders.html" class="active">🧾<span>Orders</span></a>
  <a href="login.html">👤<span>Account</span></a>
</nav>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabase.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
